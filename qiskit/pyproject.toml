[project]
name = "qimono-kernel-python-3"
version = "0.1.0"
description = "Standalone Qiskit snippets: gates, algorithms, and hybrid workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.14",
    "pylatexenc>=2.10",
    "sympy>=1.14.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "notebook>=7.2",
]

[tool.uv]
package = false

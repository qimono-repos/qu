[project]
name = "qimono-quantum-circuits"
version = "0.1.0"
description = "Tiny quantum circuit-model utilities for Qimono"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
superposition-stats = "quantum_circuits.superposition:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qimono-kernel-braket"
version = "0.1.0"
description = "Standalone Amazon Braket snippets: local simulators and hybrid workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "amazon-braket-sdk>=1.80",
    "amazon-braket-local-simulator>=1.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "notebook>=7.2",
]

[tool.uv]
package = false
python-preference = "only-system"

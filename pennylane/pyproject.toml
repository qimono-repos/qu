[project]
name = "qimono-kernel-pennylane"
version = "0.1.0"
description = "Standalone PennyLane snippets: QML, gradients, and framework interop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pennylane>=0.45",
    "pennylane-lightning>=0.45",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "notebook>=7.2",
]

[tool.uv]
package = false

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0b1530"/>
  <!-- blocks -->
  <g fill="#111f42">
    <rect x="30" y="60" width="120" height="160" rx="6"/><rect x="190" y="60" width="190" height="160" rx="6"/>
    <rect x="420" y="60" width="160" height="160" rx="6"/><rect x="620" y="60" width="220" height="160" rx="6"/>
    <rect x="880" y="60" width="370" height="160" rx="6"/>
    <rect x="30" y="280" width="120" height="420" rx="6"/><rect x="190" y="280" width="190" height="420" rx="6"/>
    <rect x="420" y="280" width="160" height="420" rx="6"/><rect x="620" y="280" width="220" height="420" rx="6"/>
    <rect x="880" y="280" width="370" height="420" rx="6"/>
  </g>
  <!-- side streets -->
  <g stroke="#2a3a66" stroke-width="20" stroke-linecap="round">
    <line x1="170" y1="30" x2="170" y2="720"/><line x1="400" y1="30" x2="400" y2="720"/>
    <line x1="600" y1="30" x2="600" y2="720"/><line x1="860" y1="30" x2="860" y2="720"/>
  </g>
  <!-- railway -->
  <line x1="300" y1="30" x2="340" y2="720" stroke="#3b4c7a" stroke-width="3" stroke-dasharray="10 8"/>
  <!-- Main St -->
  <rect x="0" y="230" width="1280" height="40" fill="#1f6f78"/>
  <text x="40" y="256" fill="#d9f6f4" font-size="16" font-weight="700" letter-spacing="3">W MAIN ST</text>
  <g fill="#8fa3cf" font-size="13" font-weight="600" letter-spacing="1.5">
    <text x="182" y="320" transform="rotate(90 182 320)">S INDIANA AVE</text>
    <text x="412" y="320" transform="rotate(90 412 320)">MICHIGAN AVE</text>
    <text x="612" y="408" transform="rotate(90 612 408)">S OTSEGO AVE</text>
    <text x="872" y="320" transform="rotate(90 872 320)">S COURT AVE</text>
  </g>
  <!-- signal from museum to park -->
  <path d="M500 250 Q545 238 590 250 T680 250 T770 250 T860 250 T950 250 T1040 250" fill="none" stroke="#7ff0e0" stroke-width="2.5" opacity="0.85"/>
  <g fill="#7ff0e0" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="13" opacity="0.9">
    <text x="640" y="225">0 1 1 0</text><text x="925" y="225">1 0 1 |ψ⟩</text>
  </g>
  <!-- pins -->
  <g>
    <circle cx="500" cy="250" r="15" fill="#ffb547" stroke="#0b1530" stroke-width="4"/><text x="500" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#0b1530">1</text>
    <circle cx="860" cy="250" r="15" fill="#ffb547" stroke="#0b1530" stroke-width="4"/><text x="860" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#0b1530">2</text>
    <circle cx="1040" cy="250" r="15" fill="#ffb547" stroke="#0b1530" stroke-width="4"/><text x="1040" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#0b1530">3</text>
  </g>
  <!-- legend cards -->
  <g font-size="15">
    <rect x="440" y="300" width="390" height="92" rx="10" fill="#0b1530" stroke="#ffb547" stroke-width="1.5"/>
    <text x="460" y="330" fill="#ffb547" font-weight="800">1  Otsego County Historical Museum</text>
    <text x="460" y="354" fill="#d7def0">320 W Main St</text>
    <text x="460" y="376" fill="#d7def0">Permanent exhibit on Shannon's inventions</text>
    <rect x="900" y="300" width="350" height="66" rx="10" fill="#0b1530" stroke="#ffb547" stroke-width="1.5"/>
    <text x="920" y="330" fill="#ffb547" font-weight="800">2  Main St at S Court Ave</text>
    <text x="920" y="354" fill="#d7def0">Site of his father's business</text>
    <rect x="900" y="384" width="350" height="92" rx="10" fill="#0b1530" stroke="#ffb547" stroke-width="1.5"/>
    <text x="920" y="414" fill="#ffb547" font-weight="800">3  Claude Shannon Park</text>
    <text x="920" y="438" fill="#d7def0">126 W Main St</text>
    <text x="920" y="460" fill="#d7def0">IEEE bronze statue, unveiled 6 Oct 2000</text>
  </g>
  <!-- title -->
  <rect x="40" y="540" width="780" height="150" rx="12" fill="#0b1530" opacity="0.92"/>
  <text x="60" y="600" fill="#ffffff" font-size="46" font-weight="800">Shannon's Gaylord</text>
  <text x="60" y="638" fill="#9fe9e0" font-size="20" font-weight="600">Bridging Information IV · The Quantum Chapter by Qimono</text>
  <text x="60" y="670" fill="#6f83b3" font-size="14">West Main Street, Gaylord, Michigan · illustration, not to scale · Qimono (TM)</text>
</svg>

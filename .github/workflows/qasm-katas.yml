name: QASM Katas Check

on:
  pull_request:
    branches: [ trunk ]
    paths:
      - '.github/workflows/qasm-katas.yml'
      - 'first-code/practice/katas/**'
  push:
    branches: [ trunk, qasm-katas-ci ]
    paths:
      - '.github/workflows/qasm-katas.yml'
      - 'first-code/practice/katas/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --project first-code
      - name: Check QASM katas
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail

          failures=0
          checked=0
          mkdir -p "$RUNNER_TEMP/qasm-circuit-diagrams"
          diagram_index=0

          printf '| Kata | Result | Diagnostic | Circuit diagram |\n|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"

          for f in first-code/practice/katas/*.qasm; do
            [[ -f "$f" ]] || continue
            checked=$((checked + 1))
            diagram_index=$((diagram_index + 1))
            echo "=== CHECKING $f ==="

            output_file="$(mktemp)"
            if PYTHONUNBUFFERED=1 uv run --project first-code python -u first-code/qasm_check.py "$f" >"$output_file" 2>&1; then
              status=0
            else
              status=$?
            fi
            cat "$output_file"

            result="PASS"
            diagnostic="—"
            if [[ "$status" -ne 0 ]]; then
              failures=$((failures + 1))
              result="FAIL (exit $status)"
              # Prefer a parser location when supplied; otherwise annotate the file.
              python - "$f" "$output_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          path, output_path = sys.argv[1:]
          text = Path(output_path).read_text(encoding="utf-8", errors="replace")
          location = re.search(r"<input>:(\d+),(\d+):\s*(.*?)\"?\s*$", text, re.MULTILINE)
          if location:
              line, zero_based_col, message = location.groups()
              col = int(zero_based_col) + 1
          else:
              line, col = None, None
              candidates = [s.strip() for s in text.splitlines() if "error" in s.lower() or "exception" in s.lower()]
              message = candidates[-1] if candidates else "QASM check failed; see the step log for full output"
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          props = f"file={path}"
          if line:
              props += f",line={line},col={col}"
          print(f"::error {props}::{message}")
          PY
              diagnostic="$(python - "$output_file" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          match = re.search(r"<input>:\d+,\d+:\s*(.*?)\"?\s*$", text, re.MULTILINE)
          if match:
              diagnostic = match.group(1)
          else:
              lines = [s.strip() for s in text.splitlines() if s.strip()]
              candidates = [s for s in lines if "error" in s.lower() or "exception" in s.lower()]
              diagnostic = candidates[-1] if candidates else "See full step log"
          print(diagnostic.replace("|", "\\|").replace("\n", " "))
          PY
          )"
            fi

            diagram="—"
            diagram_file="$RUNNER_TEMP/qasm-circuit-diagrams/circuit-${diagram_index}.png"
            # Draw only files that parse and lower successfully. qasm_check --draw
            # gives us the text circuit; use Qiskit's mpl drawer for a visual image.
            if [[ "$status" -eq 0 ]]; then
              if PYTHONUNBUFFERED=1 uv run --project first-code python - "$f" "$diagram_file" <<'PY'
          import sys
          from pathlib import Path
          import matplotlib
          matplotlib.use("Agg")
          from qiskit import qasm2
          from qiskit import circuit as qiskit_circuit
          from qiskit.visualization import circuit_drawer
          source, target = map(Path, sys.argv[1:])
          qc = qasm2.load(source)
          fig = circuit_drawer(qc, output="mpl")
          fig.savefig(target, dpi=160, bbox_inches="tight")
          print(f"Circuit diagram written to {target}")
          PY
              then
                diagram="![circuit](https://example.invalid/circuit-${diagram_index}.png)"
                echo "Circuit diagram generated: $diagram_file"
              else
                echo "::warning file=$f::Circuit diagram generation failed; see logs"
              fi
            fi

            printf '| `%s` | %s | %s | %s |\n' "$f" "$result" "$diagnostic" "$diagram" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$output_file"
          done

          if [[ "$checked" -eq 0 ]]; then
            echo "::warning::No QASM kata files were found."
          fi
          printf '\n**Checked:** %s QASM file(s). **Failed:** %s.\n' "$checked" "$failures" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failures" -gt 0 ]]; then exit 1; fi
          exit 0

      - name: Upload circuit diagrams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qasm-circuit-diagrams
          path: ${{ runner.temp }}/qasm-circuit-diagrams/*.png
          if-no-files-found: ignore

[project]
name = "qimono-kernel-pyquil"
version = "0.1.0"
description = "Standalone PyQuil snippets: Rigetti's quantum programming framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyquil>=4.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "notebook>=7.2",
]

[tool.uv]
package = false
python-preference = "only-system"

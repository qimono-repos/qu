[project]
name = "qimono-week-4"
version = "0.1.0"
description = "Local Qiskit workspace for MIT xPRO QCFx1 Week 4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "qiskit>=2.0",
    "qiskit-aer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
